[package]
name = "watery-gpu-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "wgsl"] }
pollster = "=0.4.0"
watery-core = { path = "../.." }
watery-gpu = { path = "../../gpu" }

[patch.crates-io]
naga = { path = "../../vendor/horizon/third_party/naga" }
wgpu-hal = { path = "../../vendor/horizon/third_party/wgpu-hal" }

[workspace]
