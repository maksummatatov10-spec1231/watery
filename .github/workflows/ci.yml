name: Watery CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-package:
    name: Core, Horizon adapter, and package reader
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Watery
        uses: actions/checkout@v4

      - name: Read pinned Horizon revision
        id: horizon
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("reference/horizon-source.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Horizon source
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ steps.horizon.outputs.commit }}
          path: vendor/horizon
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check formatting of optimized Rust paths
        run: rustfmt --edition 2024 --check src/terrain.rs src/solid_cache.rs benches/terrain.rs

      - name: Verify preserved original assets
        run: python3 tools/verify_reference.py

      - name: Test core library
        run: cargo test --locked --manifest-path Cargo.toml

      - name: Benchmark CPU terrain and solid-cache hot paths
        run: |
          cargo bench --locked --bench terrain --features bench-reference 2>&1 | tee /tmp/terrain-bench.log
          while IFS='|' read -r marker name metrics; do
            echo "::notice title=CPU benchmark::$name $metrics"
            echo "- **$name**: $metrics" >> "$GITHUB_STEP_SUMMARY"
          done < <(grep '^BENCH_RESULT|' /tmp/terrain-bench.log)

      - name: Verify deterministic development package
        run: |
          python3 tools/package_native.py
          cmp artifacts/watery-1.2.2-dev.1.hnmod watery-1.2.2-dev.1.hnmod
          sha256sum artifacts/watery-1.2.2-dev.1.hnmod > /tmp/watery-package.sha256
          python3 tools/package_native.py
          cmp artifacts/watery-1.2.2-dev.1.hnmod watery-1.2.2-dev.1.hnmod
          sha256sum --check /tmp/watery-package.sha256

      - name: Compile adapter and read the package with Horizon
        run: python3 tools/check_native.py --test

  gpu:
    name: GPU pipelines and simulation regressions (Vulkan / lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Watery
        uses: actions/checkout@v4

      - name: Read pinned Horizon revision
        id: horizon
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("reference/horizon-source.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Horizon shader dependencies
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ steps.horizon.outputs.commit }}
          path: vendor/horizon
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install Vulkan software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          icd="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -print 2>/dev/null | grep -Ei 'lvp|lavapipe' | head -n 1 || true)"
          if [ -z "$icd" ]; then
            echo "Lavapipe ICD was not installed; available Vulkan ICDs:"
            find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "Using Vulkan ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Clear stale GPU check report
        run: rm -f reference/gpu-check-report.md

      - name: Run GPU pipeline and simulation checks
        run: |
          set +e
          cargo run --locked --manifest-path tools/gpu-check/Cargo.toml > /tmp/gpu-check.log 2>&1
          result=$?
          cat /tmp/gpu-check.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          lines = Path("/tmp/gpu-check.log").read_text(errors="replace").splitlines()[-60:]
          tail = ("\n".join(lines) + "\n").encode()
          payload = base64.b64encode(gzip.compress(tail, compresslevel=9)).decode()
          print(f"::notice title=GPU-log-gzip-base64::{payload}")
          PY
          fi
          exit "$result"

      - name: Save GPU check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-check-report
          path: reference/gpu-check-report.md
          if-no-files-found: ignore

      - name: Publish GPU check report in workflow annotation
        if: always()
        run: |
          if [ -f reference/gpu-check-report.md ]; then
            report="$(base64 -w0 reference/gpu-check-report.md)"
            echo "::notice title=GPU-check-report-base64::$report"
          else
            echo "::warning title=GPU-check-report::Report was not generated"
          fi
